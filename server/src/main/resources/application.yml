server:
  port: ${PORT:3000}
  error:
    include-message: never
spring:
  application:
    name: autohost-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:TallerDB2}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:taller_api_user}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 155MB
autohost:
  jwt-secret: ${JWT_SECRET}
  jwt-expires-in: ${JWT_EXPIRES_IN:8h}
  password-pepper: ${PASSWORD_PEPPER:}
  upload-root: ${UPLOAD_ROOT:/app/uploads}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  mail-mode: ${MAIL_MODE:ethereal}
  email-from: ${EMAIL_FROM:no-reply@taller.local}
  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:587}
  smtp-user: ${SMTP_USER:}
  smtp-pass: ${SMTP_PASS:}
