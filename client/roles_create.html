<div class="page-kicker">CONFIGURACIÓN</div>
<h1 class="page-title">Crear rol</h1>
<p class="page-subtitle">Registra un perfil para organizar el acceso al sistema.</p>
<section class="form-panel roles-form-panel"><div class="panel-heading"><div><h2>Nuevo rol</h2><p>Define el nombre y una descripción para el perfil.</p></div><span class="subtle-tag">NUEVO REGISTRO</span></div>
  <form id="roleCreateForm" class="role-form"><label for="roleCreateName">Nombre del rol *</label><input class="form-control" id="roleCreateName" name="name" placeholder="Ej. supervisor" minlength="2" maxlength="60" required><label for="roleCreateDescription">Descripción <span>(opcional)</span></label><textarea class="form-control" id="roleCreateDescription" name="description" rows="3" maxlength="250" placeholder="Describe brevemente este rol"></textarea><div class="role-form-actions"><button class="primary-btn" id="roleCreateButton" type="submit">Crear rol</button></div></form>
</section>
