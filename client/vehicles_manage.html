<div class="page-kicker">FLOTA</div><div class="vehicle-heading"><div><h1 class="page-title">Administrar vehículos</h1><p class="page-subtitle">Consulta, edita y desactiva los vehículos registrados.</p></div><label class="vehicle-inactive-toggle"><input type="checkbox" id="vehicleIncludeInactive"> Incluir desactivados</label></div>
<section class="panel vehicle-table-panel"><div class="panel-heading"><div><h2>Vehículos</h2><p id="vehicleSummary">Cargando registros…</p></div><span class="subtle-tag">MÁXIMO 10 POR PÁGINA</span></div><div class="table-wrap"><table class="table vehicle-table"><thead><tr><th>FOTOS</th><th>VIN / PLACA</th><th>VEHÍCULO</th><th>ESTATUS</th><th>MECÁNICO</th><th>CLIENTE</th><th>ACCIONES</th></tr></thead><tbody id="vehicleRows"><tr><td colspan="7" class="vehicle-loading">Cargando vehículos…</td></tr></tbody></table></div><div class="vehicle-pagination"><span id="vehiclePageInfo">Página 1</span><div><button type="button" id="vehiclePrev">Anterior</button><button type="button" id="vehicleNext">Siguiente</button></div></div></section>
<dialog id="vehicleEditDialog" class="vehicle-dialog"><div class="vehicle-dialog-header"><div><span class="page-kicker">ACTUALIZACIÓN</span><h2>Editar vehículo</h2></div><button type="button" id="vehicleEditClose" class="vehicle-close" aria-label="Cerrar">×</button></div>
  <form id="vehicleEditForm" class="vehicle-form vehicle-edit-form" enctype="multipart/form-data"><input type="hidden" name="id"><div class="vehicle-fields">
    <label>VIN *<input name="VIN" maxlength="17" minlength="17" pattern="[a-hj-npr-z0-9]{17}" title="17 caracteres; no se permiten I, O o Q" required></label><label>Placa *<input name="Placa" maxlength="8" pattern="([a-z]{3}[0-9]{4}|[a-z]{2}[0-9]{4}[a-z]|[a-z]{3}[0-9]{3}[a-z])" title="Ejemplos: ABC1234, AB123CD o ABC123D" required></label>
    <label>Marca *<input name="Marca" maxlength="80" required></label><label>Modelo *<input name="Modelo" maxlength="80" required></label><label>Año *<input name="Anio" type="number" min="1886" max="2027" required></label><label>Versión *<input name="Version" maxlength="100" required></label><label>Color *<input name="Color" maxlength="50" required></label><label>Estatus *<select name="Estatus" required><option value="activo">Activo</option><option value="en_taller">En taller</option><option value="desactivado">Desactivado</option></select></label>
    <label class="vehicle-full-width">Técnico mecánico <span>(opcional)</span><select name="MecanicoId"><option value="">Sin asignar</option></select></label><div class="vehicle-full-width vehicle-current-photos" id="vehicleCurrentPhotos"></div><label class="vehicle-full-width">Agregar fotografías <span>(hasta 10 archivos, 15 MB cada uno; se agregan a las actuales)</span><input name="fotos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
  </div><div class="vehicle-form-actions"><span>Las fotos existentes se conservan.</span><button type="button" class="vehicle-cancel" id="vehicleEditCancel">Cancelar</button><button class="primary-btn" id="vehicleEditSubmit" type="submit">Guardar cambios</button></div></form>
</dialog>
