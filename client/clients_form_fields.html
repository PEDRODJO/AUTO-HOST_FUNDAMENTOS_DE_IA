<div class="client-form-section"><h3>Información personal</h3><div class="client-form-grid">
  <label>Nombre *<input name="Nombre" maxlength="80" autocomplete="given-name" required></label><label>Apellido paterno *<input name="ApellidoPaterno" maxlength="80" autocomplete="family-name" required></label><label>Apellido materno<input name="ApellidoMaterno" maxlength="80" autocomplete="additional-name"></label>
  <label>Correo electrónico *<input name="Email" type="email" maxlength="254" autocomplete="email" required></label><label>Teléfono personal *<input name="TelefonoPersonal" type="tel" maxlength="30" autocomplete="tel" required></label><label>Teléfono de trabajo<input name="TelefonoTrabajo" type="tel" maxlength="30"></label>
  <label>Teléfono de emergencia *<input name="TelefonoEmergencia" type="tel" maxlength="30" required></label><label>Nombre del contacto de emergencia *<input name="NombreContactoEmergencia" maxlength="120" required></label><label>Apellido paterno del contacto *<input name="ApellidoPaternoContactoEmergencia" maxlength="80" required></label><label>Apellido materno del contacto<input name="ApellidoMaternoContactoEmergencia" maxlength="80"></label>
</div></div>
<div class="client-form-section"><h3>Domicilio y asignación</h3><div class="client-form-grid">
  <label>Calle *<input name="Calle" maxlength="160" autocomplete="address-line1" required></label><label>Número *<input name="Numero" maxlength="30" autocomplete="address-line2" required></label><label>Colonia *<input name="Colonia" maxlength="120" autocomplete="address-level3" required></label><label>Estado *<input name="Estado" maxlength="100" autocomplete="address-level1" required></label><label>Municipio *<input name="Municipio" maxlength="120" autocomplete="address-level2" required></label><label>Código postal *<input name="CodigoPostal" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code" required></label><label class="client-workshop-field">Taller *<select name="TallerId" required><option value="">Selecciona un taller activo</option></select></label>
</div></div>
